<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fleet</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 46rem; padding: 0.75rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  h1 { font-size: 1.1rem; margin: 0; }
  small, .dim { opacity: 0.65; }
  form { display: flex; gap: 0.4rem; margin: 0.6rem 0; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 0.45rem 0.6rem; }
  input[name=text], input[name=prompt] { flex: 1 1 12rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li a { display: block; padding: 0.55rem 0; border-bottom: 1px solid #8884; text-decoration: none; color: inherit; }
  #log { font: 13px/1.35 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  .ev { padding: 0.2rem 0; border-bottom: 1px solid #8882; }
  .input { color: #2a7; } .meta { opacity: 0.6; } .err { color: #c33; }
  .turn > summary { cursor: pointer; padding: 0.35rem 0; border-bottom: 1px solid #8884; font: 15px/1.4 system-ui, sans-serif; }
  .bar { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .hint { margin: -0.3rem 0 0.6rem; font-size: 0.9rem; opacity: 0.75; }
  .hint b { font-weight: 600; }
</style>
<header><h1><a href="#">fleet</a></h1><small id="who"></small></header>
<main id="main"></main>
<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const key = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
  const text = await r.text();
  if (!r.ok) throw new Error(text.trim() || r.statusText);
  return text ? JSON.parse(text) : null;
}
let node, es;
const main = document.getElementById("main");
function fail(e) { main.prepend($(`<p class="err">${esc(e.message || e)}</p>`)); }

async function home() {
  const [list, node] = await Promise.all([api("GET", "/v1/sessions"), api("GET", "/v1/node")]);
  main.replaceChildren();
  const f = $(`<form>
    <input name="repo" placeholder="owner/repo" autocapitalize="off">
    <input name="branch" placeholder="branch (blank: default branch)" autocapitalize="off">
    <input name="model" placeholder="model (default: settings.json's)">
    <input name="prompt" placeholder="first prompt" required><button>Spawn</button></form>`);
  const hint = $(`<p class="hint"></p>`);
  const explain = () => {
    const repo = f.elements.repo.value.trim();
    hint.innerHTML = repo
      ? `Each turn clones <b>${esc(repo)}</b> and pushes to <b>fleet/&lt;session&gt;</b>.`
      : `<b>No repo: scratch.</b> Files Pi writes are gone after each turn; only the transcript is kept.`;
  };
  f.elements.repo.oninput = explain;
  explain();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const d = new FormData(f);
    try { const r = await api("POST", "/v1/sessions", { model: d.get("model").trim(), repo: d.get("repo").trim(), branch: d.get("branch").trim(), title: d.get("prompt").slice(0, 60), key: key(), prompt: d.get("prompt") }); location.hash = r.sid; } catch (e) { fail(e); }
  };
  main.append(f, hint);
  const ul = $("<ul></ul>");
  for (const s of list) {
    const where = s.running ? "turn running" : "idle";
    ul.append($(`<li><a href="#${s.sid}">${esc(s.title || s.sid)}<br><small>${esc(s.owner)} · ${where} · ${s.head} events${s.usage && s.usage.input ? ` · ${s.usage.input}/${s.usage.output} tok` : ""}${s.repo ? ` · ${esc(s.repo)}${s.commit ? "@" + esc(s.commit.slice(0, 8)) : ""}` : " · scratch"}${s.fork_of ? " · fork" : ""}</small></a></li>`));
  }
  if (!list.length) ul.append($(`<li class="dim">No sessions yet.</li>`));
  for (const [sid, why] of Object.entries(node.unreadable || {})) {
    ul.append($(`<li class="err">Unreadable: ${esc(sid)}<br><small>${esc(why)}</small></li>`));
  }
  main.append(ul);
}

// Pi's message_end and tool_execution_end carry the full result, so the
// message_start and *_update lines before them are not shown.
function render(e) {
  let body;
  if (e.kind === "out") {
    let text = e.data;
    try {
      const m = JSON.parse(e.data);
      if (m.type === "message_start" || /_update$/.test(m.type)) return null;
      text = m.text ?? m.message?.content ?? e.data;
      if (Array.isArray(text)) text = text.map((c) => c.type === "text" ? c.text : c.type === "toolCall" ? `${c.name} ${JSON.stringify(c.arguments)}` : JSON.stringify(c)).join("\n");
      if (typeof text !== "string") text = JSON.stringify(text);
    } catch {}
    body = esc(text);
  } else if (e.kind === "input") body = `<span class="input">${esc(e.by)}: ${esc(e.data.text || "")}</span>`;
  else body = `<span class="meta">${esc(e.kind)} ${esc(e.node)} ${e.data ? esc(JSON.stringify(e.data)) : ""}</span>`;
  return $(`<div class="ev"><small class="dim">${e.seq}</small> ${body}</div>`);
}

async function view(sid) {
  const st = await api("GET", `/v1/sessions/${sid}`);
  main.replaceChildren();
  main.append($(`<p><b>${esc(st.title || sid)}</b><br><small>${esc(sid)} · owner ${esc(st.owner)}${st.running ? " · turn running" : ""}${st.fork_of ? ` · forked from <a href="#${st.fork_of}">${esc(st.fork_of)}</a>` : ""}</small></p>`));
  main.append(st.repo
    ? $(`<p class="hint">${esc(st.repo)} · pushes to <b>fleet/${esc(sid)}</b>${st.commit ? ` · last push ${esc(st.commit.slice(0, 12))}` : ""}</p>`)
    : $(`<p class="hint"><b>Scratch session:</b> no repo, so files Pi writes are gone after each turn. Fork keeps only the transcript.</p>`));
  const bar = $(`<div class="bar"></div>`);
  const btn = (label, fn) => { const b = $(`<button>${label}</button>`); b.onclick = () => fn().then(() => view(sid)).catch(fail); bar.append(b); };
  if (st.running) btn("Abort", () => api("POST", `/v1/sessions/${sid}/abort`));
  btn("Fork", async () => { const r = await api("POST", `/v1/sessions/${sid}/fork`, { key: key() }); location.hash = r.sid; });
  main.append(bar);
  const log = $(`<div id="log"></div>`);
  main.append(log);
  const f = $(`<form><input name="text" placeholder="prompt (one turn at a time)" required autocomplete="off"><button>Send</button></form>`);
  f.onsubmit = async (e) => { e.preventDefault(); const d = new FormData(f); try { await api("POST", `/v1/sessions/${sid}/inputs`, { key: key(), text: d.get("text") }); f.reset(); } catch (e) { fail(e); } };
  main.append(f);
  es = new EventSource(`/v1/sessions/${sid}/events`);
  // One <details> per turn; a new turn closes the one before it.
  let turn, info, lines = 0;
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.kind === "input") {
      if (turn) turn.open = false;
      turn = $(`<details class="turn" open><summary><small class="dim">${e.run}</small> <span class="input">${esc(e.by)}: ${esc(e.data.text || "")}</span> <small class="dim"></small></summary></details>`);
      info = turn.querySelector("summary small:last-child");
      lines = 0;
      log.append(turn);
      return;
    }
    if (turn && e.kind.startsWith("out")) info.textContent = `${++lines} lines`;
    if (turn && e.kind === "exited") info.textContent = `${lines} lines · exit ${e.data?.code ?? 0}`;
    const row = render(e);
    if (row) (e.run && turn ? turn : log).append(row);
  };
}

async function route() {
  if (es) { es.close(); es = null; }
  const sid = location.hash.slice(1);
  try { await (sid ? view(sid) : home()); } catch (e) { fail(e); }
}
(async () => {
  try { node = await api("GET", "/v1/node"); } catch (e) { return fail(e); }
  document.getElementById("who").textContent = `${node.you} on ${node.name}`;
  addEventListener("hashchange", route);
  route();
})();
</script>
